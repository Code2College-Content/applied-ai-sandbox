<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}Sandbox Notes{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
    h1 { margin-bottom: 0.25rem; }
    .meta { color: #666; margin-bottom: 1.5rem; }
    .note { border: 1px solid #ddd; border-radius: 8px; padding: 1rem; margin-bottom: 0.75rem; }
    .note h3 { margin: 0 0 0.5rem; }
    a.btn { display: inline-block; background: #1a2540; color: #fff; padding: 0.5rem 1rem; border-radius: 6px; text-decoration: none; }
    label { display: block; margin: 1rem 0 0.25rem; font-weight: 600; }
    input, textarea { width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 6px; font: inherit; }
    .actions { margin-top: 1.5rem; }
    button { background: #1a2540; color: #fff; padding: 0.5rem 1.25rem; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; }
    .error { color: #b00020; margin-top: 0.25rem; font-size: 0.9rem; }
    nav { margin-bottom: 1.5rem; font-size: 0.9rem; color: #555; }
    nav a { margin-left: 1rem; color: #1a2540; }
    .flash { background: #fff3cd; border: 1px solid #ffc107; border-radius: 6px; padding: 0.5rem 0.75rem; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <nav>
    {% if current_user.is_authenticated %}
      Hi, <strong>{{ current_user.username }}</strong>
      <a href="{{ url_for('logout') }}">Log out</a>
    {% else %}
      <a href="{{ url_for('login') }}">Log in</a>
      <a href="{{ url_for('register') }}">Register</a>
    {% endif %}
  </nav>

  {% with messages = get_flashed_messages() %}
    {% for msg in messages %}<p class="flash">{{ msg }}</p>{% endfor %}
  {% endwith %}

  {% block content %}{% endblock %}
</body>
</html>
