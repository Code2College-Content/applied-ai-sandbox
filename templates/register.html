<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register · Sandbox</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 420px; margin: 4rem auto; padding: 0 1rem; }
    h1 { margin-bottom: 1.5rem; }
    label { display: block; margin: 1rem 0 0.25rem; font-weight: 600; }
    input { width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 6px; font: inherit; box-sizing: border-box; }
    button { margin-top: 1.5rem; width: 100%; background: #1a2540; color: #fff; padding: 0.6rem; border: none; border-radius: 6px; font-size: 1rem; font-weight: 600; cursor: pointer; }
    .error { color: #b00020; margin-top: 0.5rem; font-size: 0.9rem; }
    .footer { margin-top: 1.5rem; text-align: center; font-size: 0.9rem; color: #555; }
    a { color: #1a2540; }
  </style>
</head>
<body>
  <h1>Create an account</h1>

  <form method="POST">
    <label for="username">Username</label>
    <input id="username" name="username" type="text" autocomplete="username" required>

    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="new-password" required>

    {% if error %}<p class="error">{{ error }}</p>{% endif %}

    <button type="submit">Register</button>
  </form>

  <p class="footer">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
</body>
</html>
