<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register · Sandbox</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
    label { display: block; margin: 1rem 0 0.25rem; font-weight: 600; }
    input { width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 6px; font: inherit; }
    .actions { margin-top: 1.5rem; }
    button { background: #1a2540; color: #fff; padding: 0.5rem 1.25rem; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; }
    a { color: #555; margin-left: 1rem; }
    .error { color: #b00020; margin-top: 0.25rem; font-size: 0.9rem; }
  </style>
</head>
<body>
  <h1>Register</h1>

  <form method="POST">
    <label for="username">Username</label>
    <input id="username" name="username" type="text" value="{{ username or '' }}">

    <label for="password">Password</label>
    <input id="password" name="password" type="password" value="">

    <label for="confirm">Confirm password</label>
    <input id="confirm" name="confirm" type="password" value="">

    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}

    <div class="actions">
      <button type="submit">Create account</button>
      <a href="{{ url_for('login') }}">Already have an account?</a>
    </div>
  </form>
</body>
</html>
