<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sandbox Notes</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
    h1 { margin-bottom: 0.25rem; }
    .meta { color: #666; margin-bottom: 1.5rem; }
    .note { border: 1px solid #ddd; border-radius: 8px; padding: 1rem; margin-bottom: 0.75rem; }
    .note h3 { margin: 0 0 0.5rem; }
    a.btn { display: inline-block; background: #1a2540; color: #fff; padding: 0.5rem 1rem; border-radius: 6px; text-decoration: none; }
  </style>
</head>
<body>
  <h1>Sandbox Notes</h1>
  <p class="meta">A tiny note-taking app. Practice ground for the Applied AI cohort.</p>

  <form method="GET" action="{{ url_for('home') }}" style="margin-top: 1.5rem; display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: flex-end;">
    <label for="q" style="font-weight: 600; margin-bottom: 0;">Search</label>
    <input id="q" name="q" type="search" value="{{ query or '' }}" placeholder="Search title or body" style="flex: 1 1 260px; padding: 0.5rem; border: 1px solid #ccc; border-radius: 6px;">
    <button type="submit" style="background: #1a2540; color: #fff; padding: 0.55rem 1rem; border: none; border-radius: 6px; cursor: pointer;">Search</button>
    {% if query %}
      <a class="btn" href="{{ url_for('home') }}" style="background: #666;">Clear</a>
    {% endif %}
  </form>

  <a class="btn" href="{{ url_for('new_note') }}">+ New note</a>

  <h2 style="margin-top: 2rem;">Your notes ({{ notes|length }})</h2>
  {% if notes %}
    {% for note in notes %}
      <div class="note">
        <h3>{{ note.title }}</h3>
        <p>{{ note.body }}</p>
      </div>
    {% endfor %}
  {% else %}
    <p>No notes yet.</p>
  {% endif %}
</body>
</html>
