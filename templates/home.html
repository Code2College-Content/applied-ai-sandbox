<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sandbox Notes</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
    h1 { margin-bottom: 0.25rem; }
    .meta { color: #666; margin-bottom: 1.5rem; }
    .note { border: 1px solid #ddd; border-radius: 8px; padding: 1rem; margin-bottom: 0.75rem; }
    .note h3 { margin: 0 0 0.5rem; }
    a.btn { display: inline-block; background: #1a2540; color: #fff; padding: 0.5rem 1rem; border-radius: 6px; text-decoration: none; }
    nav { display: flex; justify-content: flex-end; align-items: center; gap: 1rem; margin-bottom: 1rem; font-size: 0.9rem; color: #555; }
    nav form { margin: 0; }
    nav button { background: none; border: none; color: #1a2540; cursor: pointer; font-size: 0.9rem; padding: 0; text-decoration: underline; }
  </style>
</head>
<body>
  <nav>
    Logged in as <strong>{{ username }}</strong>
    <form method="POST" action="{{ url_for('logout') }}">
      <button type="submit">Log out</button>
    </form>
  </nav>

  <h1>Sandbox Notes</h1>
  <p class="meta">A tiny note-taking app. Practice ground for the Applied AI cohort.</p>

  <a class="btn" href="{{ url_for('new_note') }}">+ New note</a>

  <h2 style="margin-top: 2rem;">Your notes ({{ notes|length }})</h2>
  {% if notes %}
    {% for note in notes %}
      <div class="note">
        <h3>{{ note.title }}</h3>
        <p>{{ note.body }}</p>
      </div>
    {% endfor %}
  {% else %}
    <p>No notes yet.</p>
  {% endif %}
</body>
</html>
