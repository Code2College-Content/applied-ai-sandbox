<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sandbox Notes</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
    .note { border: 1px solid #ddd; border-radius: 8px; padding: 1rem; margin-bottom: 0.75rem; }
    .note h3 { margin: 0 0 0.5rem; }
    form { display: inline; }
    button { margin-top: 0.5rem; background: #b00020; color: white; border: none; padding: 0.4rem 0.7rem; border-radius: 6px; cursor: pointer; }
  </style>
</head>
<body>

  <h1>Sandbox Notes</h1>

  <a href="{{ url_for('new_note') }}">+ New note</a>

  <h2>Your notes</h2>

  {% for note in notes %}
    <div class="note">
      <h3>{{ note.title }}</h3>
      <p>{{ note.body }}</p>

      <!-- ✅ THIS is what the tests are looking for -->
      <form method="POST" action="/notes/{{ loop.index0 }}/delete">
        <button type="submit">Delete</button>
      </form>
    </div>
  {% else %}
    <p>No notes yet.</p>
  {% endfor %}

</body>
</html>
