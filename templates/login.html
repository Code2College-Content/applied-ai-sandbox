<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login · Sandbox</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 400px; margin: 4rem auto; padding: 0 1rem; }
    label { display: block; margin: 1rem 0 0.25rem; font-weight: 600; }
    input { width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 6px; font: inherit; box-sizing: border-box; }
    button { margin-top: 1.5rem; background: #1a2540; color: #fff; padding: 0.5rem 1.25rem; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; width: 100%; }
    .error { color: #b00020; margin-top: 0.75rem; font-size: 0.9rem; }
    .alt { margin-top: 1rem; text-align: center; font-size: 0.9rem; }
  </style>
</head>
<body>
  <h1>Log in</h1>

  <form method="POST">
    <label for="username">Username</label>
    <input id="username" name="username" type="text" autocomplete="username" required>

    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>

    {% if error %}
      <p class="error">{{ error }}</p>
    {% endif %}

    <button type="submit">Log in</button>
  </form>

  <p class="alt">No account? <a href="{{ url_for('register') }}">Register</a></p>
</body>
</html>
