{% extends 'base.html' %}
{% block title %}New Note · Sandbox{% endblock %}
{% block content %}
<h1>New note</h1>

<form method="POST">
  <label for="title">Title</label>
  <input id="title" name="title" type="text" value="{{ title or '' }}">
  {% if error %}<p class="error">{{ error }}</p>{% endif %}

  <label for="body">Body</label>
  <textarea id="body" name="body" rows="6">{{ body or '' }}</textarea>

  <div class="actions">
    <button type="submit">Save note</button>
    <a href="{{ url_for('home') }}">Cancel</a>
  </div>
</form>
{% endblock %}
