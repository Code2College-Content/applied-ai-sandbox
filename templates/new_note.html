<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Note Sandbox</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='new_note.css') }}">
</head>
<body>
  <main>
    <section class="page-shell">
      <h1>New note</h1>

      <form method="POST">
        <label for="title">Title</label>
        <input id="title" name="title" type="text" value="{{ title or '' }}">
        {% if error %}
          <div class="error">{{ error }}</div>
        {% endif %}

        <label for="body">Body</label>
        <textarea id="body" name="body" rows="6">{{ body or '' }}</textarea>

        <div class="actions">
          <button type="submit">Save note</button>
          <a href="{{ url_for('home') }}">Cancel</a>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
